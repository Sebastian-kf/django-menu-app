<h1>menu index page</h1>

<div style="padding: 15 10;">
{% if menu_item_list %}
    <ul>
        {% for item in menu_item_list %}
        <li>
            <div>
                <div>
                    <img src="{{item.image.url}}" style="height: 8rem; width: 8rem; position: center;">
                <h4>{{ item.menu_item_name }}</h4>
                </div>
                <div>
                    <h6>{{ item.item_description }}</h6>
                </div>
                <div>
                    <p>{{ item.item_price }}</p>
                </div>
            </div>
        </li>
        {% endfor %}
    </ul>
{% else %}
 <h4>No items available at this time</h4>
{% endif %}
</div>
